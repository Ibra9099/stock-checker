name: Daily stock data

permissions:
  contents: write

on:
  schedule:
    - cron: "0 23 * * *" # Run ~2 hours after U.S. market close
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run prediction
        run: bun src/index.ts predict --ticker="NVDA,AAPL,MSFT,GOOGL,AVGO,MU,LLY,TSLA,AMD,XOM,JNJ,ABBV,CSCO,AMAT,LRCX,MRK,HD,PG,PANW,GEV,KLAC,TXN,ORCL,TMO,SNDK,LIN,IBM,MRVL,ABT,PEP,ANET,CRWD,STX,UNP,GILD,ADI,COP,QCOM,BKNG,WELL,CRM,TJX,UBER,NEM,NOW,VRTX,DHR,PLD,ISRG,LOW,MDT,ADBE,GLW,SYK,ACN,FCX,VRT,EQIX,CSX,TT,MMM,MCK,FTNT,PWR,CEG,JCI,EMR,EOG,CDNS,WM,DASH,MDLZ,SLB,SHW,CMI,REGN,ROST,ORLY,ITW,NSC,UPS,CL,BSX,SNPS,ECL,TGT,MNST,URI,CTAS,APD,LITE,TEL,TER,COR,CRH,NXPI,DVN,NUE,FIX,MPWR,FAST,CAH,CIEN,COHR,BDX,CTVA,GWW,ADSK,EW,EBAY,NKE,WAB,GRMN,CARR,ROK,IDXX,A,ROP,MCHP,DHI,WDAY,RSG,AZO,FLEX,NTAP,EXPE,WAT,ODFL,ADM,KVUE,VMC,JBL,KMB,RMD,DXCM,GEHC,CTSH,HAL,BIIB,IR,STLD,MLM,ON,CPRT,OTIS,LH,HSY,HUBB,TPR,PPG,DOV,WSM,XYL,EXPD,PHM,STE,VLTO,TPL,EL,MTD,CHD,WST,VRSN,EFX,JBHT,FFIV,FSLR,PKG,RDDT,INCY,ULTA,SMCI,NDSN,GPC,CF,WY,DD,TSCO,PTC,FICO,CDW,CSGP,IT,ZBRA,TRMB,BBY,IEX,ALB,ALLE,COO,RVTY,GDDY,MKC,MAS,MAA,AKAM,CHRW,AVY,ALGN,GNRC,PNR,LII,TYL,CRL,TECH,LULU,ROL,RL,CLX,SWKS,DECK,PODD,AOS,TTD,BLDR
        " --sort=asc
        working-directory: packages/core
        env:
          # OHLCV fallback when Yahoo is rate-limited (see services/tiingo.ts)
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      - name: Pull latest changes before commit
        # --autostash: the predict step leaves updated CSVs unstaged, which a
        # plain pull --rebase refuses to run on.
        run: git pull --rebase --autostash origin main
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: daily stock data update"
          file_pattern: "packages/core/public/*.csv"
